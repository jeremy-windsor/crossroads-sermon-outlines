<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Search Crossroads sermons, series, Overview text, and Scripture references.">
  <meta name="color-scheme" content="light dark">
  <title>Search | Crossroads Sermons</title>
  <script>/* Runs before the stylesheet so a saved preference applies before first paint. */
try {
  const savedTheme = localStorage.getItem('crossroads-theme');
  if (savedTheme === 'light' || savedTheme === 'dark') {
    document.documentElement.dataset.theme = savedTheme;
  }
} catch (_) { /* Storage can be unavailable; the system palette remains readable. */ }
</script>
  <link rel="stylesheet" href="assets/site.css">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <nav class="site-nav" aria-label="Main navigation">
    <a href="index.html" class="site-name">Crossroads Sermons</a>
    <div class="nav-links"><a href="index.html">Series</a> <a href="archive.html">Timeline</a></div>
    <form class="site-search" role="search" action="search.html" method="get">
      <label class="visually-hidden" for="site-search-query">Search sermons</label>
      <input id="site-search-query" name="q" type="search" autocomplete="off" placeholder="Search sermons or Scripture">
      <button type="submit">Search</button>
    </form>
    <div class="theme-controls"><button class="theme-toggle" type="button" aria-pressed="false" hidden>Dark theme</button><button class="theme-reset" type="button" hidden>Use system theme</button></div>
  </nav>
  <header><p class="kicker">Search</p><h1>Search sermons</h1><p class="lede">Search titles, speakers, series, Overview text, and Scripture references.</p></header>
  <main id="main-content" tabindex="-1"><section class="search-page" aria-labelledby="search-results-heading">
<h2 id="search-results-heading">Results</h2>
<p class="search-help">Try a title, speaker, phrase, or reference such as “Psalm 51:10” or “Hebrews 12.”</p>
<noscript><p class="search-status">Search requires JavaScript. Browse by series or use the Timeline instead.</p></noscript>
<p id="search-status" class="search-status" role="status" aria-live="polite">Enter a search above.</p>
<ol id="search-results" class="search-results" aria-label="Search results"></ol>
</section></main>
  <footer><nav aria-label="Related links"><a href="https://youtube.com/@thecrossroadschurch">Crossroads Church on YouTube</a></nav></footer>
  <script>(() => {
  const root = document.documentElement;
  const toggle = document.querySelector('.theme-toggle');
  const reset = document.querySelector('.theme-reset');
  const system = window.matchMedia('(prefers-color-scheme: dark)');
  const isDark = () => root.dataset.theme ? root.dataset.theme === 'dark' : system.matches;
  const sync = () => {
    toggle.setAttribute('aria-pressed', String(isDark()));
    reset.hidden = !root.dataset.theme;
  };
  toggle.hidden = false;
  toggle.addEventListener('click', () => {
    root.dataset.theme = isDark() ? 'light' : 'dark';
    try { localStorage.setItem('crossroads-theme', root.dataset.theme); } catch (_) {}
    sync();
  });
  reset.addEventListener('click', () => {
    delete root.dataset.theme;
    try { localStorage.removeItem('crossroads-theme'); } catch (_) {}
    sync();
    toggle.focus();
  });
  system.addEventListener('change', sync);
  sync();
})();
</script>
  <script>(() => {
  'use strict';

  const form = document.querySelector('.site-search');
  const input = document.querySelector('#site-search-query');
  const status = document.querySelector('#search-status');
  const results = document.querySelector('#search-results');
  if (!form || !input || !status || !results) return;

  const normalize = value => value.normalize('NFKD').replace(/[\u0300-\u036f]/g, '').toLocaleLowerCase().replace(/\s+/g, ' ').trim();
  const query = new URLSearchParams(window.location.search).get('q') || '';
  input.value = query;
  const terms = normalize(query).split(' ').filter(Boolean);

  const appendText = (parent, tag, text, className) => {
    const element = document.createElement(tag);
    if (className) element.className = className;
    element.textContent = text;
    parent.appendChild(element);
    return element;
  };

  const show = documents => {
    results.replaceChildren();
    if (!terms.length) {
      status.textContent = 'Enter a search above.';
      return;
    }
    const matches = documents.map((item, order) => {
      const haystack = normalize(item.terms);
      if (!terms.every(term => haystack.includes(term))) return null;
      const title = normalize(item.title);
      const phrase = normalize(query);
      const excerpts = item.excerpts || [item.excerpt];
      let score = terms.reduce((total, term) => total + (title.includes(term) ? 8 : 1), 0);
      if (title === phrase) score += 30;
      else if (title.startsWith(phrase)) score += 15;
      if (excerpts.some(excerpt => normalize(excerpt).includes(phrase))) score += 20;
      else if (haystack.includes(phrase)) score += 5;
      if (item.kind === 'scripture' && terms.some(term => normalize(item.reference || '').includes(term))) score += 6;
      return {item, order, score};
    }).filter(Boolean).sort((left, right) => right.score - left.score || left.order - right.order);

    const shown = matches.slice(0, 100);
    status.textContent = matches.length === 1 ? '1 result' : `${matches.length} results`;
    for (const {item} of shown) {
      const excerpts = item.excerpts || [item.excerpt];
      const excerpt = excerpts.reduce((best, candidate) => {
        const score = terms.filter(term => normalize(candidate).includes(term)).length;
        return score > best.score ? {text: candidate, score} : best;
      }, {text: item.excerpt, score: -1}).text;
      const entry = document.createElement('li');
      const article = document.createElement('article');
      const heading = document.createElement('h2');
      const anchor = document.createElement('a');
      anchor.href = item.url;
      anchor.textContent = item.title;
      heading.appendChild(anchor);
      article.appendChild(heading);
      appendText(article, 'p', item.context, 'result-meta');
      appendText(article, 'p', excerpt, 'result-excerpt');
      entry.appendChild(article);
      results.appendChild(entry);
    }
    if (matches.length > shown.length) {
      appendText(status, 'span', ` Showing the first ${shown.length}.`, 'result-limit');
    }
  };

  fetch('search-index.json', {credentials: 'same-origin'})
    .then(response => {
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      return response.json();
    })
    .then(index => show(index.documents))
    .catch(() => {
      status.textContent = 'Search is temporarily unavailable. Browse by series or use the Timeline.';
    });
})();
</script>
</body>
</html>
