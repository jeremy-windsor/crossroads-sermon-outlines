<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Browse Crossroads sermons by year and month.">
  <meta name="color-scheme" content="light dark">
  <title>Timeline | Crossroads Sermons</title>
  <script>/* Runs before the stylesheet so a saved preference applies before first paint. */
try {
  const savedTheme = localStorage.getItem('crossroads-theme');
  if (savedTheme === 'light' || savedTheme === 'dark') {
    document.documentElement.dataset.theme = savedTheme;
  }
} catch (_) { /* Storage can be unavailable; the system palette remains readable. */ }
</script>
  <link rel="stylesheet" href="assets/site.css">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <nav class="site-nav" aria-label="Main navigation">
    <a href="index.html" class="site-name">Crossroads Sermons</a>
    <div class="nav-links"><a href="index.html">Series</a> <a href="archive.html" aria-current="page">Timeline</a></div>
    <form class="site-search" role="search" action="search.html" method="get">
      <label class="visually-hidden" for="site-search-query">Search sermons</label>
      <input id="site-search-query" name="q" type="search" autocomplete="off" placeholder="Search sermons or Scripture">
      <button type="submit">Search</button>
    </form>
    <div class="theme-controls"><button class="theme-toggle" type="button" aria-pressed="false" hidden>Dark theme</button><button class="theme-reset" type="button" hidden>Use system theme</button></div>
  </nav>
  <header><p class="kicker">Timeline</p><h1>Sermon timeline</h1><p class="lede">Browse by year and month to find a message.</p></header>
  <main id="main-content" tabindex="-1"><ul class="year-list"><li><p class="year-head"><a href="archive/2026.html" class="year-link">2026</a><span>9 sermons</span></p><nav class="month-strip" aria-label="Months with sermons in 2026"><span aria-hidden="true">Jan</span><span aria-hidden="true">Feb</span><span aria-hidden="true">Mar</span><span aria-hidden="true">Apr</span><span aria-hidden="true">May</span><span aria-hidden="true">Jun</span><a href="archive/2026.html#2026-07" aria-label="July 2026">Jul</a><a href="archive/2026.html#2026-08" aria-label="August 2026">Aug</a><span aria-hidden="true">Sep</span><span aria-hidden="true">Oct</span><span aria-hidden="true">Nov</span><span aria-hidden="true">Dec</span></nav></li></ul></main>
  <footer><nav aria-label="Related links"><a href="https://youtube.com/@thecrossroadschurch">Crossroads Church on YouTube</a></nav></footer>
  <script>(() => {
  const root = document.documentElement;
  const toggle = document.querySelector('.theme-toggle');
  const reset = document.querySelector('.theme-reset');
  const system = window.matchMedia('(prefers-color-scheme: dark)');
  const isDark = () => root.dataset.theme ? root.dataset.theme === 'dark' : system.matches;
  const sync = () => {
    toggle.setAttribute('aria-pressed', String(isDark()));
    reset.hidden = !root.dataset.theme;
  };
  toggle.hidden = false;
  toggle.addEventListener('click', () => {
    root.dataset.theme = isDark() ? 'light' : 'dark';
    try { localStorage.setItem('crossroads-theme', root.dataset.theme); } catch (_) {}
    sync();
  });
  reset.addEventListener('click', () => {
    delete root.dataset.theme;
    try { localStorage.removeItem('crossroads-theme'); } catch (_) {}
    sync();
    toggle.focus();
  });
  system.addEventListener('change', sync);
  sync();
})();
</script>
</body>
</html>
