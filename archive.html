<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <meta name="color-scheme" content="light dark">
  <title>Timeline | Crossroads Sermons</title>
  <script>/* Runs before the stylesheet so a saved preference applies before first paint. */
try {
  const savedTheme = localStorage.getItem('crossroads-theme');
  if (savedTheme === 'light' || savedTheme === 'dark') {
    document.documentElement.dataset.theme = savedTheme;
  }
} catch (_) { /* Storage can be unavailable; the system palette remains readable. */ }
</script>
  <link rel="stylesheet" href="assets/site.css">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <nav class="site-nav" aria-label="Main navigation">
    <a href="index.html" class="site-name">Crossroads Sermons</a>
    <div class="nav-links"><a href="index.html">Series</a> <a href="archive.html" aria-current="page">Timeline</a></div>
    <form class="site-search" role="search" action="search.html" method="get">
      <label class="visually-hidden" for="site-search-query">Search sermons</label>
      <input id="site-search-query" name="q" type="search" autocomplete="off" placeholder="Search sermons or Scripture">
      <button type="submit">Search</button>
    </form>
    <button class="theme-toggle" type="button" aria-label="Toggle color theme" title="Toggle color theme" hidden><svg data-theme-icon="light" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.66 6.34l1.41-1.41"></path></svg><svg data-theme-icon="dark" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"></path></svg></button>
  </nav>
  <header><p class="kicker">Timeline</p><h1>Sermon timeline</h1><p class="lede">Browse by year and month to find a message.</p></header>
  <main id="main-content" tabindex="-1"><ul class="year-list"><li><p class="year-head"><a href="archive/2026.html" class="year-link">2026</a><span>18 sermons</span></p><nav class="month-strip" aria-label="Months with sermons in 2026"><span aria-hidden="true">Jan</span><span aria-hidden="true">Feb</span><span aria-hidden="true">Mar</span><span aria-hidden="true">Apr</span><a href="archive/2026.html#2026-05" aria-label="May 2026">May</a><a href="archive/2026.html#2026-06" aria-label="June 2026">Jun</a><a href="archive/2026.html#2026-07" aria-label="July 2026">Jul</a><a href="archive/2026.html#2026-08" aria-label="August 2026">Aug</a><span aria-hidden="true">Sep</span><span aria-hidden="true">Oct</span><span aria-hidden="true">Nov</span><span aria-hidden="true">Dec</span></nav></li></ul></main>
  <footer><nav aria-label="Related links"><a href="https://thecrossroads.church" target="_blank" rel="noopener noreferrer">Crossroads Church</a> <a href="https://www.youtube.com/@thecrossroadschurch" target="_blank" rel="noopener noreferrer">Crossroads Church on YouTube</a></nav></footer>
  <script>(() => {
  const root = document.documentElement;
  const toggle = document.querySelector('.theme-toggle');
  const icons = Array.from(toggle.querySelectorAll('[data-theme-icon]'));
  const system = window.matchMedia('(prefers-color-scheme: dark)');
  const current = () => root.dataset.theme || (system.matches ? 'dark' : 'light');
  const sync = () => {
    const target = current() === 'dark' ? 'light' : 'dark';
    const label = `Switch to ${target} theme`;
    toggle.setAttribute('aria-label', label);
    toggle.setAttribute('title', label);
    for (const icon of icons) {
      // SVG elements do not reflect the `hidden` IDL property, so set the attribute.
      icon.toggleAttribute('hidden', icon.dataset.themeIcon !== target);
    }
  };
  const apply = choice => {
    root.dataset.theme = choice;
    try { localStorage.setItem('crossroads-theme', choice); } catch (_) {}
    sync();
  };
  toggle.hidden = false;
  toggle.addEventListener('click', () => apply(current() === 'dark' ? 'light' : 'dark'));
  system.addEventListener('change', sync);
  sync();
})();
</script>
</body>
</html>
